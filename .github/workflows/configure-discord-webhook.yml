name: Configure Discord Webhook

on:
  workflow_dispatch:
    inputs:
      webhook_url:
        description: "Discord Webhook URL (https://discord.com/api/webhooks/...)"
        required: true
        type: string

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and put Cloudflare Pages secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBHOOK_URL: ${{ inputs.webhook_url }}
        run: |
          # Prevent webhook from appearing in Actions logs
          echo "::add-mask::$WEBHOOK_URL"
          case "$WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "Invalid Discord Webhook URL"; exit 1 ;;
          esac
          printf '%s' "$WEBHOOK_URL" | npx --yes wrangler@4 pages secret put DISCORD_WEBHOOK_URL --project-name=mobile-order-system
          echo "Uploaded DISCORD_WEBHOOK_URL to Pages production secrets"
