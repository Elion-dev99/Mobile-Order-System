name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'attached_assets' \
            --exclude 'publish' \
            --exclude '.firebaserc' \
            --exclude 'firebase.json' \
            --exclude 'firestore.rules' \
            --exclude 'functions' \
            ./ publish/
          # Cloudflare Pages Functions (Slack notify proxy, etc.)
          if [ -d functions ]; then
            rm -rf publish/functions
            cp -a functions publish/functions
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish --project-name=mobile-order-system --branch=main --commit-dirty=true
