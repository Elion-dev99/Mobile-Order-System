name: Cardinal auto-merge

# Squash-merge eligible cursor/* PRs. Post-deploy canary will roll back main
# if probes/display checks fail (see deploy-cloudflare-pages.yml).
# Policy: docs/autonomy.md
#
# PAUSED (2026-08): GitHub Actions 通信障害対応 — 自動マージ・マージ後 Deploy 起動を停止。
# 再開: docs/cardinal-automation-pause.md

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge (optional)"
        required: false
        type: string
      allow_deploy_dispatch:
        description: "If true, dispatch Deploy after merge"
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '*/25 * * * *'

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
  statuses: read

concurrency:
  group: cardinal-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARDINAL_GH_PAT: ${{ secrets.CARDINAL_GH_PAT }}
          GH_REPO: ${{ github.repository }}
          ONLY_PR: ${{ github.event.inputs.pr || '' }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          HEAD_REF: ${{ github.head_ref || '' }}
          CARDINAL_AUTOMATION_PAUSED: 'false'
          DISPATCH_DEPLOY_AFTER_MERGE: ${{ github.event.inputs.allow_deploy_dispatch || 'true' }}
        run: |
          chmod +x scripts/cardinal-auto-merge.sh
          ./scripts/cardinal-auto-merge.sh
