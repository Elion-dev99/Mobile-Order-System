name: Cardinal auto-merge

# Squash-merge eligible cursor/* PRs. Post-deploy canary will roll back main
# if probes/display checks fail (see deploy-cloudflare-pages.yml).
# Policy: docs/autonomy.md

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: cardinal-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ONLY_PR: ${{ github.event.inputs.pr || '' }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          HEAD_REF: ${{ github.head_ref || '' }}
        run: |
          chmod +x scripts/cardinal-auto-merge.sh
          ./scripts/cardinal-auto-merge.sh
