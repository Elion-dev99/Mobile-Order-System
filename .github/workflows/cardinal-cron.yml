name: Cardinal cron watchdog

# Always-on half of Cardinal without Cursor Automations UI:
# hourly site probe → wake Executor only when unhealthy.
# Relies on Cloudflare Pages secret CURSOR_API_KEY (already configured).

on:
  schedule:
    - cron: '15 * * * *' # hourly at :15 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force Guardian dispatch even when healthy"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Cardinal tick
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          BODY=$(printf '%s' "{\"action\":\"tick\",\"force\":$( [ \"$FORCE\" = \"true\" ] && echo true || echo false ),\"source\":\"github-cron\",\"baseUrl\":\"https://mobile-order-system.pages.dev\"}")
          echo "POST /api/cardinal tick force=$FORCE"
          RESP=$(curl -sS -X POST 'https://mobile-order-system.pages.dev/api/cardinal' \
            -H 'content-type: application/json' \
            -d "$BODY")
          echo "$RESP" | tee /tmp/cardinal-tick.json
          echo "$RESP" | grep -q '"ok":true' || echo "$RESP" | grep -q '"ok": true' || {
            echo "Cardinal tick failed"
            exit 1
          }
