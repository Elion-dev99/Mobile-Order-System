name: Configure AWS bridge

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: AWS_ACCESS_KEY_ID (IAM user for bridge only)
        required: true
        type: string
      aws_secret_access_key:
        description: AWS_SECRET_ACCESS_KEY
        required: true
        type: string
      aws_region:
        description: AWS_REGION (default ap-northeast-1)
        required: false
        default: ap-northeast-1
        type: string
      event_bus_name:
        description: AWS_EVENT_BUS_NAME (optional custom bus)
        required: false
        type: string
      sqs_queue_url:
        description: AWS_SQS_QUEUE_URL (optional)
        required: false
        type: string
      sns_topic_arn:
        description: AWS_SNS_TOPIC_ARN (optional)
        required: false
        type: string

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
          AWS_REGION: ${{ inputs.aws_region }}
          EVENT_BUS: ${{ inputs.event_bus_name }}
          SQS_URL: ${{ inputs.sqs_queue_url }}
          SNS_ARN: ${{ inputs.sns_topic_arn }}
        run: |
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "skip $name"
              return 0
            fi
            echo "::add-mask::$value"
            printf '%s' "$value" | npx --yes wrangler@4 pages secret put "$name" --project-name=mobile-order-system
            echo "put $name"
          }
          put_secret AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
          put_secret AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
          put_secret AWS_REGION "$AWS_REGION"
          put_secret AWS_EVENT_BUS_NAME "$EVENT_BUS"
          put_secret AWS_SQS_QUEUE_URL "$SQS_URL"
          put_secret AWS_SNS_TOPIC_ARN "$SNS_ARN"
          printf '%s' 'true' | npx --yes wrangler@4 pages secret put AWS_MIRROR_INCIDENTS --project-name=mobile-order-system
          echo "AWS bridge secrets uploaded. Test: GET /api/aws and POST action=ping with OPS_API_SECRET"
