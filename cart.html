<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0D5C4D">
  <title>カート | QuickOrder</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // SPA: cart lives inside index.html — keep deep links working
    (function () {
      var q = new URLSearchParams(location.search);
      q.set('view', 'cart');
      var dest = 'index.html?' + q.toString();
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:24px;text-align:center;">メニューへ移動しています…</p>
  <p style="text-align:center;"><a id="fallback" href="index.html">メニューを開く</a></p>
  <script>
    document.getElementById('fallback').href = 'index.html?' + new URLSearchParams(location.search).toString().replace(/(^|&)view=[^&]*/,'') + (location.search ? '&' : '') + 'view=cart';
  </script>
</body>
</html>
